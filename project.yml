name: Classic2048
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Classic2048:
    type: application
    platform: macOS
    sources:
      - Sources/Classic2048
      - path: Sources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: GameCore
    settings:
      base:
        PRODUCT_NAME: "2048"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: local.classic2048.mac
        INFOPLIST_FILE: Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  GameCore:
    type: framework
    platform: macOS
    sources:
      - Sources/GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.classic2048.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  GameCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/GameCoreTests
    dependencies:
      - target: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.classic2048.coretests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Classic2048:
    build:
      targets:
        Classic2048: all
        GameCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GameCoreTests
    archive:
      config: Release
